name: python-deps
description: Set up Python and install lab dependencies with pip caching

inputs:
  python-version:
    description: Python version to use
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          lab4/requirements.txt
          lab4/requirements-dev.txt

    - shell: bash
      run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
