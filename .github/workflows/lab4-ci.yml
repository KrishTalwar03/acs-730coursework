name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
      - name: Run tests
        working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        run: docker build -t acs730-lab4:${{ steps.meta.outputs.image-tag }} lab4/
      - name: Save image as artifact
        run: docker save acs730-lab4:${{ steps.meta.outputs.image-tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Smoke test
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  summary:
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "Test: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke: ${{ needs.smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: ${{ needs.build.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if an upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
