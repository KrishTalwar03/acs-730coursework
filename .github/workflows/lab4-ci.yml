name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        working-directory: lab4
        run: python -m pytest

  image:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:smoke

      - name: Pull published image on main
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ needs.image.outputs.image-ref }}
        run: docker pull "$IMAGE_REF"

      - name: Smoke test
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && 'acs730-lab4:smoke' || needs.image.outputs.image-ref }}
        run: |
          docker run -d --name app -p 8000:8000 "$IMAGE_REF"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  summary:
    needs: [test, image, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "Tests: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ needs.image.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke: ${{ needs.smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image reference: ${{ needs.image.outputs.image-ref }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if an upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
