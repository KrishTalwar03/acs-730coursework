name: lab6-configure

on:
  push:
    paths:
      - 'lab6/**'
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create infrastructure (costs money)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  configure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible, AWS collections and boto3
        run: |
          python3 -m pip install --quiet "ansible-core>=2.16" boto3 botocore
          ansible-galaxy collection install amazon.aws community.aws

      - name: Install SSM Session Manager plugin
        run: |
          curl -sSfL -o /tmp/ssm.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb
          session-manager-plugin --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: Import existing Lab 6 resources into runner state
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=acs730-lab6-sg" "Name=tag:Lab,Values=lab6" \
            --query 'SecurityGroups[0].GroupId' --output text)

          IID0=$(aws ec2 describe-instances \
            --filters "Name=tag:Lab,Values=lab6" "Name=tag:Name,Values=acs730-lab6-web-0" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          IID1=$(aws ec2 describe-instances \
            --filters "Name=tag:Lab,Values=lab6" "Name=tag:Name,Values=acs730-lab6-web-1" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          terraform import -input=false aws_security_group.web "$SG_ID"
          terraform import -input=false 'aws_instance.web[0]' "$IID0"
          terraform import -input=false 'aws_instance.web[1]' "$IID1"

      - name: terraform plan
        run: terraform plan -input=false

      - name: terraform apply
        if: inputs.apply
        run: terraform apply -input=false -auto-approve

      - name: Converge the instances with Ansible
        if: inputs.apply
        working-directory: lab6/ansible
        run: |
          for i in $(seq 1 30); do
            ansible -i inventory/ role_web -m ansible.builtin.ping && break
            echo "waiting for the SSM agent to register ($i/30)"
            sleep 10
          done
          ansible-playbook -i inventory/ site.yml -l role_web
